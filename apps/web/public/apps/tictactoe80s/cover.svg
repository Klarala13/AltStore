<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A14"/>
      <stop offset="1" stop-color="#14142A"/>
    </linearGradient>
    <linearGradient id="grid" x1="420" y1="180" x2="1180" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#FF2ED1"/>
    </linearGradient>
    <filter id="softGlow" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="260" cy="120" r="280" fill="#1CFF00" fill-opacity="0.06"/>
  <circle cx="1420" cy="820" r="320" fill="#00F0FF" fill-opacity="0.08"/>

  <g opacity="0.22">
