    <line x1="673" y1="260" x2="673" y2="660" stroke="url(#grid)" stroke-width="24" stroke-linecap="round"/>
    <line x1="927" y1="260" x2="927" y2="660" stroke="url(#grid)" stroke-width="24" stroke-linecap="round"/>
    <line x1="500" y1="393" x2="1100" y2="393" stroke="url(#grid)" stroke-width="24" stroke-linecap="round"/>
    <line x1="500" y1="547" x2="1100" y2="547" stroke="url(#grid)" stroke-width="24" stroke-linecap="round"/>
  </g>

  <g filter="url(#softGlow)">
