    <line x1="630" y1="290" x2="548" y2="372" stroke="#1CFF00" stroke-width="18" stroke-linecap="round"/>
    <circle cx="800" cy="316" r="48" stroke="#FFB300" stroke-width="16"/>
    <line x1="975" y1="470" x2="1057" y2="552" stroke="#1CFF00" stroke-width="18" stroke-linecap="round"/>
    <line x1="1057" y1="470" x2="975" y2="552" stroke="#1CFF00" stroke-width="18" stroke-linecap="round"/>
    <circle cx="548" cy="624" r="48" stroke="#FFB300" stroke-width="16"/>
    <line x1="722" y1="624" x2="804" y2="706" stroke="#1CFF00" stroke-width="18" stroke-linecap="round"/>
