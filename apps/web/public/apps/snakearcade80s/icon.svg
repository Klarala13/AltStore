<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0B12"/>
      <stop offset="1" stop-color="#121225"/>
    </linearGradient>
    <linearGradient id="neon" x1="128" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#FF2ED1"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <rect x="40" y="40" width="432" height="432" rx="96" stroke="#2A2A43" stroke-width="4"/>

  <!-- arena grid, same neon gradient as the TicTacToe icon -->
  <g stroke="url(#neon)" stroke-width="6" stroke-linecap="round" opacity="0.35">
    <line x1="128" y1="192" x2="384" y2="192"/>
    <line x1="128" y1="256" x2="384" y2="256"/>
    <line x1="128" y1="320" x2="384" y2="320"/>
    <line x1="192" y1="128" x2="192" y2="384"/>
    <line x1="256" y1="128" x2="256" y2="384"/>
    <line x1="320" y1="128" x2="320" y2="384"/>
  </g>

  <!-- snake body -->
  <path d="M144 336V256H256V176H336" stroke="#1CFF00" stroke-width="34" stroke-linecap="round"
        stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- head -->
  <rect x="316" y="156" width="40" height="40" rx="10" fill="#1CFF00" filter="url(#glow)"/>
  <circle cx="332" cy="170" r="5" fill="#0B0B12"/>
  <circle cx="348" cy="170" r="5" fill="#0B0B12"/>

  <!-- food -->
  <circle cx="150" cy="176" r="26" stroke="#FFB300" stroke-width="16" filter="url(#glow)"/>
</svg>
